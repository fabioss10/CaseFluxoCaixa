name: CI/CD Pipeline - Fluxo Caixa

on:
  push:
    branches: [ "master", "develop" , "CICD" ]
  pull_request:
    branches: [ "master" , "CICD" ]

jobs:
  # ----------------------------------------------------------------------------
  # ESTÁGIO DE INTEGRAÇÃO CONTÍNUA (CI): Validação de Qualidade e Compilação
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Ambiente .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache de Dependências do NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restaurar Dependências
      run: dotnet restore "FluxoCaixa.Worker/FluxoCaixa.Worker.csproj"

    - name: Verificar Formatação de Código (Lint)
      run: dotnet format --verify-no-changes

    - name: Compilar Solução (Modo Release)
      run: dotnet build "FluxoCaixa.Worker/FluxoCaixa.Worker.csproj" -c Release --no-restore

    # Nota Arquitetural: Isola testes de carga/performance para evitar overhead e lentidão no CI
    - name: Executar Testes Unitários e de Integração
      run: dotnet test --no-build -c Release -v normal --filter Category!=Performance

  # ----------------------------------------------------------------------------
  # ESTÁGIO DE ENTREGA CONTÍNUA (CD): Construção e Publicação das Imagens Docker
  # Só executa se o estágio de CI passar com sucesso na branch principal
  # ----------------------------------------------------------------------------
  publish-docker-images:
    name: Build & Push Docker Images
    needs: build-and-test
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/cicd') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Autenticar no GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build e Push - API App
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./FluxoCaixa.Api/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/fluxocaixa-api:latest
          ghcr.io/${{ github.repository }}/fluxocaixa-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build e Push - Worker App
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./FluxoCaixa.Worker/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/fluxocaixa-worker:latest
          ghcr.io/${{ github.repository }}/fluxocaixa-worker:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
