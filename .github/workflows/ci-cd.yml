name: CI/CD Pipeline - Fluxo Caixa

on:
  push:
    branches: [ "main", "master", "CIDI" ]
  pull_request:
    branches: [ "main", "master" , "CIDI"  ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Ambiente .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache de Dependências do NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restaurar Dependências
      run: |
        dotnet restore ./FluxoCaixa.Api/FluxoCaixa.Api.csproj
        dotnet restore ./FluxoCaixa.Worker/FluxoCaixa.Worker.csproj
        dotnet restore ./FluxoCaixa.Tests/FluxoCaixa.Tests.csproj

    - name: Compilar Projetos (Modo Release)
      run: |
        dotnet build ./FluxoCaixa.Api/FluxoCaixa.Api.csproj -c Release --no-restore
        dotnet build ./FluxoCaixa.Worker/FluxoCaixa.Worker.csproj -c Release --no-restore

    - name: Executar Testes Unitários
      run: dotnet test ./FluxoCaixa.Tests/FluxoCaixa.Tests.csproj --no-build -c Release -v normal --filter Category!=Performance

  publish-docker-images:
    name: Build & Push Docker Images
    needs: build-and-test
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/CIDI') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Normalizar Nome do Repositório para Lowercase
      id: string
      run: echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Autenticar no GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build e Push - API App
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./FluxoCaixa.Api/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LOWERCASE }}/fluxocaixa-api:latest
          ghcr.io/${{ env.REPO_LOWERCASE }}/fluxocaixa-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build e Push - Worker App
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./FluxoCaixa.Worker/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LOWERCASE }}/fluxocaixa-worker:latest
          ghcr.io/${{ env.REPO_LOWERCASE }}/fluxocaixa-worker:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
